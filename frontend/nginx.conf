# Serves the built React app and forwards /api to Spring Boot, so the browser sees one
# origin (no CORS) and phones on the campus network reach everything through one address.
server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 30m;   # uploads; Spring enforces the per-file limit

    # Security headers. Note: nginx drops these if a location block adds its own headers,
    # so no location below uses add_header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
       
        proxy_read_timeout 60s;   # timetable generation can take a few seconds
    }

    location /actuator/health {
        proxy_pass http://backend:8080;
    }

    # React Router: unknown paths load the app, which then shows the right page.
    location / {
        try_files $uri /index.html;
    }
}
